name: ct484project
description: "BookVerse - Ứng dụng mua bán sách và khám phá tri thức online."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Routing / Navigation
  go_router: ^14.8.1

  # Local Database (SQLite)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Local Preferences
  shared_preferences: ^2.3.4

  # Network / Backend
  http: ^1.2.2

  # UI Utilities
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0

  # Formatting
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon & Splash Screen
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
